      - generic [ref=f5e92]:
        - article [ref=f5e94]:
          - heading "Что такое Free Tier" [level=2] [ref=f5e95]
          - paragraph [ref=f5e96]:
            - strong [ref=f5e97]: Free Tier (Базовый бесплатный тариф)
            - text: — это бесплатный облачный сервер базовой конфигурации, который предоставляется на срок 6 месяцев с момента первой активации.
          - paragraph [ref=f5e98]: Услуга предназначена для знакомства с платформой, тестирования небольших проектов, запуска тестовой версии продукта (MVP), выполнения задач по внедрению подхода CI/CD, работы с Docker, а также для обучения и пет-проектов. Free Tier позволяет развернуть базовую инфраструктуру без затрат и оценить возможности облачной платформы.
          - heading "Ресурсы и возможности сервера" [level=2] [ref=f5e99]
          - paragraph [ref=f5e100]: "Сервер в рамках программы Free Tier (Базовый бесплатный тариф) предоставляется на базе тарифа «Стандартный +» со следующими параметрами:"
          - generic [ref=f5e103]:
            - generic [ref=f5e104]:
              - generic [ref=f5e105]: Параметр
              - generic [ref=f5e106]: Значение
            - generic [ref=f5e107]:
              - generic [ref=f5e108]: Количество ядер виртуального процессора (vCPU)
              - generic [ref=f5e109]: 1 ядро
            - generic [ref=f5e110]:
              - generic [ref=f5e111]: Объем оперативной памяти (RAM)
              - generic [ref=f5e112]: 1 ГБ
            - generic [ref=f5e113]:
              - generic [ref=f5e114]: Дисковое пространство (SSD)
              - generic [ref=f5e115]: 10 ГБ
            - generic [ref=f5e116]:
              - generic [ref=f5e117]: Публичный IP-адрес
              - generic [ref=f5e118]: 1 (включен в тариф)
            - generic [ref=f5e119]:
              - generic [ref=f5e120]: Сеть
              - generic [ref=f5e121]: Пропускная способность (bandwidth) 20 Мбит/с (для публичной и приватной сетей)
          - heading "Дополнительные возможности" [level=3] [ref=f5e122]
          - list [ref=f5e124]:
            - listitem [ref=f5e125]:
              - paragraph [ref=f5e126]:
                - strong [ref=f5e127]: Подключение дополнительных услуг
                - text: ": вы можете заказать моментальные снимки сервера (снэпшоты), резервное копирование и другие сервисы платформы;"
            - listitem [ref=f5e128]:
              - paragraph [ref=f5e129]:
                - strong [ref=f5e130]: масштабирование
                - text: ": при достижении лимитов конфигурации или после окончания бесплатного периода вы можете увеличить ресурсы сервера (количество ядер виртуального процессора, объем оперативной памяти, дисковое пространство) с автоматическим переходом на платный тариф. Перенос данных не требуется."
          - generic [ref=f5e133]:
            - paragraph [ref=f5e134]: Важно
            - paragraph [ref=f5e135]: Дополнительные услуги оплачиваются отдельно согласно тарифам Рег.облака.
          - heading "Условия получения бесплатного сервера" [level=2] [ref=f5e136]
          - paragraph [ref=f5e137]: "Для активации Free Tier необходимо соблюдение следующих условий:"
          - list [ref=f5e139]:
            - listitem [ref=f5e140]:
              - generic [ref=f5e141]: "1"
              - generic [ref=f5e143]:
                - strong [ref=f5e144]: Идентификация пользователя
                - text: ": услуга доступна только идентифицированным пользователям (физическим или юридическим лицам, прошедшим проверку документов). Пройти идентификацию можно"
                - link "по инструкции" [ref=f5e145] [cursor=pointer]:
                  - /url: https://reg.cloud/support/cloud/nachalo-raboty/kak-proyti-identifikatsiyu-kliyentam-reg-oblaka
                - text: в базе знаний Рег.облака.
          - list [ref=f5e147]:
            - listitem [ref=f5e148]:
              - generic [ref=f5e149]: "2"
              - generic [ref=f5e151]:
                - strong [ref=f5e152]: Положительный баланс
                - text: ": баланс лицевого счета в личном кабинете Рег.облака должен быть положительным. Рекомендуемый минимальный остаток — от 100 рублей. Это необходимо для активации услуг, которые тарифицируются поминутно. Пополнить баланс можно способами, описанными"
                - link "в статье" [ref=f5e153] [cursor=pointer]:
                  - /url: https://reg.cloud/support/cloud/billing/sposoby-oplaty-kak-vystavit-i-oplatit-schet-v-regoblake
                - text: .
          - generic [ref=f5e156]:
            - paragraph [ref=f5e157]: Обратите внимание
            - paragraph
            - paragraph [ref=f5e158]: "Программа доступна:"
            - list [ref=f5e160]:
              - listitem [ref=f5e161]:
                - paragraph [ref=f5e162]: пользователям, зарегистрировавшимся 13 апреля 2026 года или позднее;
              - listitem [ref=f5e163]:
                - paragraph [ref=f5e164]: пользователям, зарегистрировавшимся до 13 апреля 2026 года, но ни разу не заказывавшим услуги в Рег.облаке.
            - paragraph
          - heading "Как заказать сервер Free Tier" [level=2] [ref=f5e165]
          - paragraph [ref=f5e166]: "Пошаговая инструкция по созданию сервера Free Tier:"
          - list [ref=f5e168]:
            - listitem [ref=f5e169]:
              - generic [ref=f5e170]: "1"
