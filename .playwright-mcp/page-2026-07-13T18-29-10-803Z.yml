                  - /url: https://cloud.reg.ru/panel/?external_client_id=04c0d712-0dc3-443d-b0f0-82c22062b04f
                - text: .
            - listitem [ref=f5e267]:
              - generic [ref=f5e268]: "2"
              - generic [ref=f5e270]:
                - text: Перейдите в раздел
                - strong [ref=f5e271]: Мои ресурсы > Виртуальные серверы
                - text: .
            - listitem [ref=f5e272]:
              - generic [ref=f5e273]: "3"
              - generic [ref=f5e274]: Кликните по строке с именем сервера.
            - listitem [ref=f5e276]:
