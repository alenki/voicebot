                - strong [ref=f5e281]: Удалить сервер
                - text: .
            - listitem [ref=f5e282]:
              - generic [ref=f5e283]: "5"
              - generic [ref=f5e285]:
                - text: Укажите имя сервера, который вы удаляете, и нажмите
                - strong [ref=f5e286]: Удалить сервер
                - text: .
          - paragraph [ref=f5e287]: После удаления сервера вы можете создать новый сервер Free Tier, если не истек 6-месячный период с момента первой активации сервиса. Если 6 месяцев прошли, создание нового бесплатного сервера станет недоступно.
