                - text: .
            - listitem [ref=f5e174]:
              - generic [ref=f5e175]: "2"
              - generic [ref=f5e177]:
                - text: Пройдите
                - link "идентификацию" [ref=f5e178] [cursor=pointer]:
                  - /url: https://reg.cloud/support/cloud/nachalo-raboty/kak-proyti-identifikatsiyu-kliyentam-reg-oblaka
                - text: .
            - listitem [ref=f5e179]:
              - generic [ref=f5e180]: "3"
              - generic [ref=f5e182]:
                - link "Пополните баланс" [ref=f5e183] [cursor=pointer]:
                  - /url: https://reg.cloud/support/cloud/billing/sposoby-oplaty-kak-vystavit-i-oplatit-schet-v-regoblake
                - text: (минимальная сумма пополнения — 100 рублей).
            - listitem [ref=f5e184]:
              - generic [ref=f5e185]: "4"
              - generic [ref=f5e187]:
                - text: Нажмите
                - strong [ref=f5e188]: Новый ресурс > Сервер
                - text: .
            - listitem [ref=f5e189]:
              - generic [ref=f5e190]: "5"
              - generic [ref=f5e192]:
                - text: В мастере заказа выберите тарифный план
                - strong [ref=f5e193]: Стандартный +
                - text: и бесплатный тариф
                - strong [ref=f5e194]: Free Tier
                - text: .
            - listitem [ref=f5e195]:
              - generic [ref=f5e196]: "6"
              - generic [ref=f5e198]:
                - text: На вкладке
                - strong [ref=f5e199]: Приложения и панели управления
                - text: выберите операционную систему или готовое приложение.
            - listitem [ref=f5e200]:
              - generic [ref=f5e201]: "7"
              - generic [ref=f5e202]: Выберите регион размещения сервера.
            - listitem [ref=f5e204]:
              - generic [ref=f5e205]: "8"
              - generic [ref=f5e206]: При необходимости закажите публичный плавающий IP-адрес, защиту от DDoS-атак и резервное копирование.
            - listitem [ref=f5e208]:
              - generic [ref=f5e209]: "9"
              - generic [ref=f5e210]: Дополнительно добавьте SSH-ключ и укажите название сервера.
            - listitem [ref=f5e212]:
              - generic [ref=f5e213]: "10"
              - generic [ref=f5e215]:
                - text: Проверьте настройки и нажмите
                - strong [ref=f5e216]: Создать сервер
                - text: .
          - paragraph [ref=f5e217]: Сервер будет создан в течение нескольких минут. Данные для подключения будут отправлены на адрес электронной почты, указанный при регистрации.
          - generic [ref=f5e220]:
            - paragraph [ref=f5e221]: Обратите внимание
            - paragraph [ref=f5e222]: Заказ дополнительных публичных IP-адресов и управление сетями недоступны на тарифе Free Tier.
          - heading "Ограничения" [level=2] [ref=f5e223]
          - paragraph [ref=f5e224]: "При использовании Free Tier действуют следующие технические и сервисные ограничения:"
          - list [ref=f5e226]:
            - listitem [ref=f5e227]:
              - paragraph [ref=f5e228]:
                - strong [ref=f5e229]: количество серверов
                - text: ": не более 1 сервера Free Tier на один аккаунт;"
            - listitem [ref=f5e230]:
              - paragraph [ref=f5e231]:
                - strong [ref=f5e232]: сетевые ограничения
                - text: ": дополнительные IP-адреса заказать нельзя. Управление сетями (создание подсетей, роутеров) и подключение к приватным сетям доступно только на платных тарифах;"
            - listitem [ref=f5e233]:
              - paragraph [ref=f5e234]:
                - strong [ref=f5e235]: пропускная способность (bandwidth)
                - text: ": ограничена 20 Мбит/с для публичной и приватной сетей;"
            - listitem [ref=f5e236]:
              - paragraph [ref=f5e237]:
                - strong [ref=f5e238]: ресурсы
                - text: ": увеличение ресурсов (количество ядер виртуального процессора, объем оперативной памяти, дисковое пространство) без перехода на платный тариф невозможно;"
            - listitem [ref=f5e239]:
              - paragraph [ref=f5e240]:
                - strong [ref=f5e241]: дополнительные услуги
                - text: ": все дополнительные услуги (моментальные снимки сервера, резервное копирование, расширенная защита от DDoS-атак и др.) кроме публичного IP-адреса, предоставляются за дополнительную плату согласно тарифам Рег.облака."
          - heading "После окончания бесплатного периода" [level=2] [ref=f5e242]
          - paragraph [ref=f5e243]: По истечении 6 месяцев с момента активации первого бесплатного сервера происходит автоматическое переключение на платную тарификацию. Ваш облачный сервер и привязанный к нему публичный IP-адрес переводятся на стандартные платные тарифы.
          - paragraph [ref=f5e244]: "Переход осуществляется на тариф «Stdp C1-M1-D10» со следующими характеристиками: 1 ядро виртуального процессора (CPU) с частотой 2,2 ГГц, 1 ГБ оперативной памяти DDR4, 10 ГБ дискового пространства на SSD-накопителе с интерфейсом NVMe."
          - paragraph [ref=f5e245]:
            - text: Стоимость тарифа можно посмотреть
            - link "по ссылке" [ref=f5e246] [cursor=pointer]:
              - /url: https://reg.cloud/support/cloud/billing/stoimost-uslug-iaas-v-publichnom-oblake-reg-ru
            - text: .
          - paragraph [ref=f5e247]: "Дальнейший сценарий зависит от состояния баланса:"
          - list [ref=f5e249]:
            - listitem [ref=f5e250]:
              - paragraph [ref=f5e251]:
                - text: если
                - strong [ref=f5e252]: баланс положительный
                - text: — сервер продолжает работать в обычном режиме. Списание средств происходит согласно платным тарифам;
            - listitem [ref=f5e253]:
              - paragraph [ref=f5e254]:
                - text: если
                - strong [ref=f5e255]: средств для продления тарифа недостаточно
                - text: — сервер автоматически приостанавливается. Вы можете пополнить баланс для возобновления работы.
          - paragraph [ref=f5e256]:
            - strong [ref=f5e257]: Удаление
            - text: ": если баланс остается отрицательным, сервер приостанавливается на 7 дней. В течение этого времени необходимо пополнить баланс. Если средства достаточные для продления тарифа не поступили, сервер удаляется без возможности восстановления."
          - paragraph [ref=f5e258]: Исключение — восстановление из резервной копии, если она создавалась как платная услуга и на ее оплату достаточно средств.
          - heading "Удаление сервера" [level=2] [ref=f5e259]
          - list [ref=f5e261]:
