                    - button "none" [ref=f6e2326]
                    - text: means the model will not call any tool and instead generates a message.
                    - button "auto" [ref=f6e2327]
                    - text: means the model can pick between generating a message or calling one or more tools.
                    - button "required" [ref=f6e2328]
                    - text: means the model must call one or more tools.
                    - text: Specifying a particular tool via
                    - 'button "{\"type\": \"function\", \"function\": {\"name\": \"my_function\"}}" [ref=f6e2329]'
                    - text: forces the model to call that tool.
                  - paragraph [ref=f6e2330]:
