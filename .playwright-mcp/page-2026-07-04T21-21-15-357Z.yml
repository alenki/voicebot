                    - paragraph [ref=e625]:
                      - superscript [ref=e626]: "1"
                      - text: Хостинг модели Brand Voice Lite не тарифицируется первые семь дней после создания голоса, чтобы пользователь мог ее протестировать, оценить эффективность и согласовать результаты. Далее оплата производится по указанному тарифу.
                - heading "Из чего складывается стоимость использования распознавания речи" [level=2] [ref=e627]:
