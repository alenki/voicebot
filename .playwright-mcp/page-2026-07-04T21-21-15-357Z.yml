                  - text: Потоковый режим распознавания
                - paragraph [ref=e635]:
                  - text: Стоимость использования SpeechKit в режиме потокового распознавания рассчитывается по
                  - link "правилам тарификации синхронного распознавания" [ref=e636] [cursor=pointer]:
                    - /url: ru/speechkit/pricing#rules-stt-short
                  - text: .
                - heading "Синхронное распознавание" [level=3] [ref=e637]:
                  - link [ref=e638] [cursor=pointer]:
                    - /url: ru/speechkit/pricing#rules-stt-short
                    - text: "#"
                    - generic [ref=e639]: Синхронное распознавание
                  - text: Синхронное распознавание
                - paragraph [ref=e640]:
                  - text: Эти правила действуют при использовании
                  - link "синхронного распознавания" [ref=e641] [cursor=pointer]:
                    - /url: ru/speechkit/stt/request
                  - text: и распознавания
                  - link "в потоковом режиме" [ref=e642] [cursor=pointer]:
                    - /url: ru/speechkit/stt/streaming
                  - text: при использовании API v2 и API v3.
                - paragraph [ref=e643]: Единица тарификации — отрезок одноканального аудио длительностью 15 секунд. Отрезки меньшей длительности округляются в большую сторону (1 секунда превращается в 15 секунд).
                - generic [ref=e644]:
                  - paragraph [ref=e645]: Важно
                  - paragraph [ref=e647]:
                    - text: В
                    - link "потоковом режиме" [ref=e648] [cursor=pointer]:
                      - /url: ru/speechkit/stt/streaming
                    - text: тарификация начинается с отправки
                    - link "сообщения с настройками распознавания" [ref=e649] [cursor=pointer]:
                      - /url: ru/speechkit/stt/streaming#specification-msg
                    - text: . Если вы не отправляли аудио после этого сообщения, оно будет считаться как использованная единица тарификации.
                - blockquote [ref=e650]:
                  - paragraph [ref=e651]:
                    - strong [ref=e652]: Примеры
                    - text: ":"
                  - list [ref=e653]:
                    - listitem [ref=e654]:
                      - paragraph [ref=e655]: 1 аудиофрагмент 37 секунд тарифицируется как 45 секунд.
                      - paragraph [ref=e656]:
                        - strong [ref=e657]: Объяснение
                        - text: ": аудио разбивается на 2 отрезка по 15 секунд и один отрезок 7 секунд. Длительность последнего отрезка будет округлена до 15 секунд. Итого, 3 отрезка по 15 секунд."
                    - listitem [ref=e658]:
                      - paragraph [ref=e659]: 2 аудиофрагмента по 5 и 8 секунд тарифицируются как 30 секунд.
                      - paragraph [ref=e660]:
                        - strong [ref=e661]: Объяснение
                        - text: ": длительность каждого аудио будет округлена до 15 секунд. Итого, 2 отрезка по 15 секунд."
