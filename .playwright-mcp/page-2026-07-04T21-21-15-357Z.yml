                - paragraph [ref=e630]:
                  - text: Стоимость использования SpeechKit для распознавания речи зависит от типа распознавания и длительности распознанного аудио. Стоимость рассчитывается за календарный месяц (
                  - link "Отчетный период" [ref=e631] [cursor=pointer]:
