                    - text: женский голос
                    - button "nigora" [ref=e746]
                    - text: — узбекский язык.
                - paragraph [ref=e747]:
                  - text: Также в ветке
                  - button "general" [ref=e748]
                  - text: стали доступны голоса
                  - button "amira" [ref=e749]
                  - text: и
                  - button "john" [ref=e750]
                  - text: .
                - heading "Релиз 09.06.22" [level=2] [ref=e751]:
                  - link [ref=e752] [cursor=pointer]:
                    - /url: ru/speechkit/release-notes-tts#090622
                    - text: "#"
                    - generic [ref=e753]: Релиз 09.06.22
                  - text: Релиз 09.06.22
                - list [ref=e754]:
                  - listitem [ref=e755]:
                    - paragraph [ref=e756]: Во всех голосах улучшены интонации и акцентирование.
                  - listitem [ref=e757]:
                    - paragraph [ref=e758]: "Появилось больше возможностей для расстановки пауз:"
                    - list [ref=e759]:
                      - listitem [ref=e760]: Исправлена ошибка, из-за которой паузы короче 1200 миллисекунд не учитывались в SSML-разметке. Однако обращаем внимание, что паузы короче 700 миллисекунд считаются подсказкой для синтеза и не позволяют в точности контролировать длительность паузы между словами.
                      - listitem [ref=e761]:
                        - text: Паузы SSML со значениями
                        - button "x-weak" [ref=e762]
                        - text: ","
                        - button "weak" [ref=e763]
                        - text: ","
                        - button "medium" [ref=e764]
                        - text: имеют большее влияние на синтезируемый текст.
                      - listitem [ref=e765]:
                        - text: Появилась возможность расставлять паузы при использовании TTS-разметки. С помощью тега
                        - button "<[small]>" [ref=e766]
                        - text: "можно задавать длительность паузы в синтезируемом тексте, например:"
                        - button "Привет, <[small]>" [ref=e767]
                        - text: ". Длительность паузы может принимать значения:"
                        - button "tiny" [ref=e768]
                        - text: ","
                        - button "small" [ref=e769]
                        - text: ","
                        - button "medium" [ref=e770]
                        - text: ","
                        - button "large" [ref=e771]
                        - text: ","
                        - button "huge" [ref=e772]
                        - text: .
                  - listitem [ref=e773]:
                    - paragraph [ref=e774]:
                      - text: Закончилась поддержка устаревшей версии голоса
                      - button "filipp:deprecated" [ref=e775]
                      - text: . Теперь
                      - button "filipp:deprecated" [ref=e776]
                      - text: и
                      - button "filipp" [ref=e777]
                      - text: звучат одинаково.
                - heading "Релиз 19.05.22" [level=2] [ref=e778]:
                  - link [ref=e779] [cursor=pointer]:
                    - /url: ru/speechkit/release-notes-tts#190522
                    - text: "#"
                    - generic [ref=e780]: Релиз 19.05.22
                  - text: Релиз 19.05.22
                - list [ref=e781]:
                  - listitem [ref=e782]:
                    - paragraph [ref=e783]: С 31 мая 2022 года прекращается поддержка устаревших голосов.
                  - listitem [ref=e784]:
                    - paragraph [ref=e785]:
                      - text: В ветке
                      - button "rc" [ref=e786]
                      - text: "для тестирования доступны новые голоса и языки:"
                    - list [ref=e787]:
                      - listitem [ref=e788]:
                        - text: женский голос
                        - button "amira" [ref=e789]
                        - text: — казахский язык;
                      - listitem [ref=e790]:
                        - text: мужской голос
                        - button "john" [ref=e791]
                        - text: — английский язык.
                    - paragraph [ref=e792]:
                      - text: Голоса доступны только в API v3 с использованием заголовка
                      - button "x-service-branch:rc" [ref=e793]
                      - text: .
                - heading "Релиз 30.03.22" [level=2] [ref=e794]:
                  - link [ref=e795] [cursor=pointer]:
                    - /url: ru/speechkit/release-notes-tts#300322
                    - text: "#"
                    - generic [ref=e796]: Релиз 30.03.22
                  - text: Релиз 30.03.22
                - list [ref=e797]:
                  - listitem [ref=e798]:
                    - paragraph [ref=e799]:
                      - text: Стандартные голоса теперь доступны только по тегу
                      - button ":deprecated" [ref=e800]
                      - text: и будут поддерживаться до 31 мая 2022 года.
                  - listitem [ref=e801]:
                    - paragraph [ref=e802]: По обращению в техническую поддержку (заявка CLOUDSUPPORT-138703) исправлены интонации и проблемы с редкими артефактами на текстах с большим количеством различных цифр.
                - heading "Релиз 17.03.22" [level=2] [ref=e803]:
                  - link [ref=e804] [cursor=pointer]:
                    - /url: ru/speechkit/release-notes-tts#170322
                    - text: "#"
                    - generic [ref=e805]: Релиз 17.03.22
                  - text: Релиз 17.03.22
                - list [ref=e806]:
                  - listitem [ref=e807]:
                    - paragraph [ref=e808]: Появилась возможность синтезировать аудиофайлы в формате MP3. Эта возможность доступна в API v3 и при работе с премиум-голосами через API v1.
                  - listitem [ref=e809]:
                    - paragraph [ref=e810]:
                      - text: Для новых голосов появилась поддержка амплуа — расширенной версии эмоциональной окраски (смотрите параметр
                      - button "emotion" [ref=e811]
                      - text: в
                      - link "API v1" [ref=e812] [cursor=pointer]:
                        - /url: ru/speechkit/tts/request#body_params
                      - text: и
                      - button "role" [ref=e813]
                      - text: в
                      - link "API v3" [ref=e814] [cursor=pointer]:
                        - /url: ru/speechkit/tts-v3/api-ref/grpc/Synthesizer/utteranceSynthesis#speechkit.tts.v3.Hints
                      - text: ). Разные варианты амплуа доступны для разных голосов. Все значения приведены в разделе
                      - link "Список голосов" [ref=e815] [cursor=pointer]:
                        - /url: ru/speechkit/tts/voices
                      - text: . При указании некорректного амплуа сервис вернет ошибку.
                  - listitem [ref=e816]:
                    - paragraph [ref=e817]:
                      - text: Исправлена регрессия в качестве расстановки акцентов для голосов
                      - button "alena" [ref=e818]
                      - text: и
                      - button "filipp" [ref=e819]
                      - text: ", улучшено качество расстановки акцентов и субъективное восприятие синтеза всех голосов."
                  - listitem [ref=e820]:
                    - paragraph [ref=e821]:
                      - text: "Начинается большое обновление стандартных голосов:"
                      - button "oksana" [ref=e822]
                      - text: ","
                      - button "ermil" [ref=e823]
                      - text: ","
                      - button "jane" [ref=e824]
                      - text: ","
                      - button "omazh" [ref=e825]
                      - text: ","
                      - button "zahar" [ref=e826]
                      - text: будут заменены на соответствующие им
                      - button "oksana:rc" [ref=e827]
                      - text: ","
                      - button "ermil:rc" [ref=e828]
                      - text: ","
                      - button "jane:rc" [ref=e829]
                      - text: ","
                      - button "omazh:rc" [ref=e830]
                      - text: ","
                      - button "zahar:rc" [ref=e831]
                      - text: . Обновление не затронет стоимость использования обычных голосов. Существующие голоса
                      - button "oksana" [ref=e832]
                      - text: ","
                      - button "ermil" [ref=e833]
                      - text: ","
                      - button "jane" [ref=e834]
                      - text: ","
                      - button "omazh" [ref=e835]
                      - text: и
                      - button "zahar" [ref=e836]
                      - text: доступны в ветке
                      - button ":deprecated" [ref=e837]
                      - text: .
                - heading "Релиз 24.01.22" [level=2] [ref=e838]:
                  - link [ref=e839] [cursor=pointer]:
                    - /url: ru/speechkit/release-notes-tts#240122
                    - text: "#"
                    - generic [ref=e840]: Релиз 24.01.22
                  - text: Релиз 24.01.22
                - list [ref=e841]:
                  - listitem [ref=e842]:
                    - paragraph [ref=e843]: Обновлена модель генерации. В новой версии исправлено произношение цифр и аббревиатур сферы финансов.
                  - listitem [ref=e844]:
                    - paragraph [ref=e845]:
                      - text: "Теперь акценты можно расставлять с помощью выделения:"
                      - button "Вы **рады** меня видеть?" [ref=e846]
                  - listitem [ref=e847]:
                    - paragraph [ref=e848]:
                      - text: Обработка SSML-пауз и SIL-тегов приведена к единому виду для поддержки интеграции с
                      - link "Яндекс Диалогами" [ref=e849] [cursor=pointer]:
                        - /url: https://dialogs.yandex.ru
                      - text: . Наличие в тексте пауз в нотации SSML или SIL рассматривается как индикатор конца фразы (utterance) — в генерируемом тексте на месте тега появляется интонация конца фразы. SSML-паузы и SIL-теги поддерживаются при генерации коротких и длинных текстов.
                - heading "Релиз 16.12.21" [level=2] [ref=e850]:
                  - link [ref=e851] [cursor=pointer]:
                    - /url: ru/speechkit/release-notes-tts#161221
                    - text: "#"
                    - generic [ref=e852]: Релиз 16.12.21
                  - text: Релиз 16.12.21
                - list [ref=e853]:
                  - listitem [ref=e854]:
                    - paragraph [ref=e855]: "Увеличены лимиты для запросов в API v3: длина синтезируемой фразы — 250 символов или 24 секунды аудио. Важно: стоимость запроса пока остается без изменений, но может быть увеличена."
                  - listitem [ref=e856]:
                    - paragraph [ref=e857]:
                      - text: Опция
                      - button "unsafe_mode" [ref=e858]
                      - text: ", доступная в API v3, позволяет автоматически разделить длинный текст, отправленный для синтеза, на отдельные фразы."
                  - listitem [ref=e859]:
                    - paragraph [ref=e860]: Тишина после синтеза последнего слова значительно сократилась. Теперь аудио заканчивается практически сразу после синтеза последнего слова.
