              - generic [ref=f3e504]:
                - paragraph [ref=f3e505]:
                  - text: Yandex Cloud AI Studio provides access to large generative models from different vendors. If out-of-the-box models are not enough, you can
                  - link "fine-tune" [ref=f3e506] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/tuning/
                  - text: some of them for more accurate responses. All roles required for working with the models are listed in
                  - link "Access management in Yandex Cloud AI Studio" [ref=f3e507] [cursor=pointer]:
                    - /url: en/ai-studio/security/
                  - text: .
                - paragraph [ref=f3e508]:
                  - text: "In a common instance, model resources are available to all Yandex Cloud users and shared between them, so model response time may increase under heavy workloads. You can be assured that other users have no access to the context of your exchanges with the model: even with logging on, requests are stored anonymized and potentially sensitive information is masked. However, we recommend"
                  - link "disabling" [ref=f3e509] [cursor=pointer]:
                    - /url: en/ai-studio/operations/disable-logging
                  - text: data logging whenever you use our models to process sensitive information.
                - paragraph [ref=f3e510]:
