                - paragraph [ref=f3e671]: Qwen3.6 35B works with Base64-encoded images.
                - heading "Model lifecycle" [level=2] [ref=f3e672]:
                  - link [ref=f3e673] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models#model-lifecycle
                    - text: "#"
                    - generic [ref=f3e674]: Model lifecycle
                  - text: Model lifecycle
                - paragraph [ref=f3e675]: Each base instance model has its own URI, which allows you to uniquely identify the model family and version. The URI stays with the model until the latter gets decommissioned. If major changes are made, a new version of the model is published separately and gets a URI of its own.
                - paragraph [ref=f3e676]:
                  - text: AI Studio informs you in advance about the decommissioning of model versions through
                  - link "release notes" [ref=f3e677] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/
                  - text: ", the"
                  - link "user community" [ref=f3e678] [cursor=pointer]:
                    - /url: https://t.me/YFM_Community
                  - text: ", and direct mail so you could make proper changes to your products. Until the end of the support period, the version will operate normally, after which all requests sent to the obsolete URI will return the"
                  - button "400 Bad Request" [ref=f3e679]
                  - text: error. There is no auto switching between versions.
                - paragraph [ref=f3e680]: "To keep your apps working with a legacy model onboard, change the model's URI in the code and follow these steps:"
                - list [ref=f3e681]:
                  - listitem [ref=f3e682]: Check the prompt and correct it for the new model to perform up to your expectations.
                  - listitem [ref=f3e683]:
                    - text: If your legacy model's
                    - link "quotas" [ref=f3e684] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/limits
                    - text: had been increased, re-request the necessary quotas for the new one.
                  - listitem [ref=f3e685]:
                    - text: If you used a
                    - link "fine-tuned model" [ref=f3e686] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/tuning/
                    - text: ", fine-tune it again."
                - paragraph [ref=f3e687]: Plan your migration to a new model well in advance because it may take time to test your new model version and fine-tune it again.
                - paragraph [ref=f3e688]:
                  - text: All models are covered by the
                  - link "SLA" [ref=f3e689] [cursor=pointer]:
                    - /url: https://yandex.cloud/en/docs/overview/sla
                  - text: .
                - paragraph [ref=f3e690]:
                  - text: YandexGPT Pro 5 and YandexGPT Pro 5.1 models remain available at
                  - button "gpt://<folder_ID>/yandexgpt/latest" [ref=f3e691]
                  - text: and
                  - button "gpt://<folder_ID>/yandexgpt/rc" [ref=f3e692]
                  - text: ", respectively, until the end of support; however, we recommend using their explicit URIs."
