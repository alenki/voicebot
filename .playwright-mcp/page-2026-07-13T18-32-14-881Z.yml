          - paragraph [ref=f8e158]: Цены актуальны для линеек виртуальных серверов «Стандартный», «Высокочастотный», «Производительный», «Выделенный CPU», «Производительный с GPU», «Производительный ФЗ-152», в том числе для всех архивных тарифов в Рег.облаке.
          - paragraph [ref=f8e159]: Разные ресурсы могут быть доступны в разных регионах, при этом стоимость не зависит от региона размещения услуги.
