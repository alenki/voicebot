          - paragraph [ref=f8e228]: В серверах может использоваться другое аналогичное по характеристикам или более мощное оборудование.
          - heading "Пример расчета стоимости" [level=2] [ref=f8e229]
          - paragraph [ref=f8e230]: "Например, стоимость сервера линейки «Производительный» в конфигурации 2 ядра процессора AMD EPYC, 2 Гб оперативной памяти, 40 Гб диска NVMe и 1 публичным IP адресом будет рассчитываться по формуле:"
          - paragraph [ref=f8e231]: Стоимость в час = 2*0,26786 (CPU) + 2*0,26786 (RAM) + 40*0,01786 (NVMe) + 0,22321 (IP) = 2,00905 р/час
          - heading "Принцип Pay-as-you-go" [level=2] [ref=f8e232]
          - paragraph [ref=f8e233]: Если сервер остановлен клиентом, то списание производится только за ресурсы IP-адреса и хранение данных на диске по тарифу хранения резервных копий (см. таблицу выше). Если для сервера заказаны коммерческие программные продукты, за них также будет производиться списание в соответствии с тарифом.
          - paragraph [ref=f8e234]: Исключение составляют облачные серверы с графическими процессорами GPU, для них принцип pay-as-you-go не действует.
