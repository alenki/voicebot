                    - text: "#"
                    - generic [ref=f10e830]: Release as of 25/03/24
                  - text: Release as of 25/03/24
                - paragraph [ref=f10e831]: Added a new YandexGPT Pro model of the YandexGPT 3 family.
                - heading "Release as of 26/01/24" [level=2] [ref=f10e832]:
                  - link [ref=f10e833] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#260124
                    - text: "#"
                    - generic [ref=f10e834]: Release as of 26/01/24
                  - text: Release as of 26/01/24
                - paragraph [ref=f10e835]:
                  - text: Updated the YandexGPT and YandexGPT Lite
                  - link "models" [ref=f10e836] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models
                  - text: and improved their response performance.
                - heading "Release as of 06/12/23" [level=2] [ref=f10e837]:
