                    - link "model" [ref=f10e842] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/models
                    - text: for asynchronous mode.
                  - listitem [ref=f10e843]: Significantly revised the service's API.
                  - listitem [ref=f10e844]: Unified model names and the way to access the models.
                - heading "Release as of 02/08/23" [level=2] [ref=f10e845]:
