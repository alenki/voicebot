            - main [ref=f10e538]:
              - heading "Yandex Cloud AI Studio release notes" [level=1] [ref=f10e539]:
                - generic [ref=f10e540]: Yandex Cloud AI Studio release notes
              - generic [ref=f10e541]:
                - heading "Release as of 28/05/2026" [level=2] [ref=f10e542]:
                  - link [ref=f10e543] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#280526
                    - text: "#"
                    - generic [ref=f10e544]: Release as of 28/05/2026
                  - text: Release as of 28/05/2026
                - list [ref=f10e545]:
                  - listitem [ref=f10e546]: Added the DeepSeek V4 Flash model to the base instance, replacing DeepSeek V3.2. DeepSeek V3.2 has been switched in favor of the new model and is no longer operational. The URI DeepSeek V3.2 will be valid until June 28, 2026.
                  - listitem [ref=f10e547]: A new model, Speech Realtime 260528, is now available for voice agents.
                  - listitem [ref=f10e548]: Added new embedding models.
                - heading "Release as of 19/05/2026" [level=2] [ref=f10e549]:
                  - link [ref=f10e550] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#190526
                    - text: "#"
                    - generic [ref=f10e551]: Release as of 19/05/2026
                  - text: Release as of 19/05/2026
                - list [ref=f10e552]:
                  - listitem [ref=f10e553]: The common instance now includes Alice AI ART models for image generation and a lightweight Alice AI LLM Flash text model. Alice AI ART is only available through the new OpenAI-compatible Images API and in the AI Studio interface.
                  - listitem [ref=f10e554]: Added Image Generation Tool to the Responses API.
                - heading "Release as of 29/04/2026" [level=2] [ref=f10e555]:
                  - link [ref=f10e556] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#290426
                    - text: "#"
                    - generic [ref=f10e557]: Release as of 29/04/2026
                  - text: Release as of 29/04/2026
                - paragraph [ref=f10e558]: Added the Qwen3.6 35B vision-language model to the base instance, replacing Qwen3.5 35B. Qwen3.5 35B has been switched in favor of the new model and is no longer operational. The Qwen3.5 URI will remain valid until May 28, 2026.
                - heading "Release as of 20/04/2026" [level=2] [ref=f10e559]:
                  - link [ref=f10e560] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#200426
                    - text: "#"
                    - generic [ref=f10e561]: Release as of 20/04/2026
                  - text: Release as of 20/04/2026
                - paragraph [ref=f10e562]: Updated the Realtime API interaction format. The previous format will be supported until May 12, 2026.
                - heading "Release as of 07/04/2026" [level=2] [ref=f10e563]:
                  - link [ref=f10e564] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#070426
                    - text: "#"
                    - generic [ref=f10e565]: Release as of 07/04/2026
                  - text: Release as of 07/04/2026
                - paragraph [ref=f10e566]: Code Interpreter turned generally available (GA).
                - heading "Release as of 31/03/2026" [level=2] [ref=f10e567]:
                  - link [ref=f10e568] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#310326
                    - text: "#"
                    - generic [ref=f10e569]: Release as of 31/03/2026
                  - text: Release as of 31/03/2026
                - list [ref=f10e570]:
                  - listitem [ref=f10e571]: The common instance now features the Qwen3.5 35B visual-linguistic model.
                  - listitem [ref=f10e572]: MCP Hub has become generally available (GA).
                  - listitem [ref=f10e573]:
                    - text: ML SDK now supports the
                    - link "Yandex SpeechKit speech recognition service" [ref=f10e574] [cursor=pointer]:
                      - /url: en/speechkit/stt/
                    - text: .
                  - listitem [ref=f10e575]:
                    - text: The Vector Stores CLI console utility is now also available in ML SDK, allowing you to create search indexes based on data from various sources. Local files, Atlassian Confluence, S3-compatible object storage (such as Yandex Object Storage), and knowledge bases based on the MediaWiki engine are supported. For more information on connectors for creating search indexes, see
                    - link "Connectors for creating Vector Store search indexes" [ref=f10e576] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/search/vectorstore-cli
                    - text: .
                - heading "Release as of 3/3/2026" [level=2] [ref=f10e577]:
                  - link [ref=f10e578] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#030326
                    - text: "#"
                    - generic [ref=f10e579]: Release as of 3/3/2026
                  - text: Release as of 3/3/2026
                - paragraph [ref=f10e580]: "Large AI Studio update:"
                - list [ref=f10e581]:
                  - listitem [ref=f10e582]: Added the DeepSeek V3.2 model.
                  - listitem [ref=f10e583]:
                    - text: The AI Studio platform, along with other Yandex Cloud AI services, is now available on
                    - link "its own domain" [ref=f10e584] [cursor=pointer]:
                      - /url: https://aistudio.yandex.ru/
                    - text: .
                  - listitem [ref=f10e585]:
                    - text: Now you can set custom model
                    - link "guardrails" [ref=f10e586] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/security/guardrails
                    - text: .
                  - listitem [ref=f10e587]: The process of creating API keys became significantly simpler, plus many other improvements were added.
                  - listitem [ref=f10e588]:
                    - text: "The platform has switched to a new pricing model. For information on the new pricing policy, watch this video overview:"
                    - list [ref=f10e589]:
                      - listitem [ref=f10e590]:
                        - link "YouTube" [ref=f10e591] [cursor=pointer]:
                          - /url: https://www.youtube.com/watch?v=SuecSzdUGWY
                      - listitem [ref=f10e592]:
                        - link "VK Video" [ref=f10e593] [cursor=pointer]:
                          - /url: https://vk.com/video-200452713_456240396
                      - listitem [ref=f10e594]:
                        - link "Rutube" [ref=f10e595] [cursor=pointer]:
                          - /url: https://rutube.ru/video/b3186cf175f89c901e22338f9cd4a0f4/
                - heading "Release as of 11/2/2026" [level=2] [ref=f10e596]:
                  - link [ref=f10e597] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#110226
                    - text: "#"
                    - generic [ref=f10e598]: Release as of 11/2/2026
                  - text: Release as of 11/2/2026
                - paragraph [ref=f10e599]:
                  - text: Added support for
                  - link "Code Interpreter" [ref=f10e600] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/agents/tools/code-interpreter
                  - text: ", an in-built Yandex Cloud AI Studio tool allowing the model to write and execute Python code in an isolated environment."
                - heading "Release as of 27/01/2026" [level=2] [ref=f10e601]:
                  - link [ref=f10e602] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#270126
                    - text: "#"
                    - generic [ref=f10e603]: Release as of 27/01/2026
                  - text: Release as of 27/01/2026
                - paragraph [ref=f10e604]:
                  - link "Renamed" [ref=f10e605] [cursor=pointer]:
                    - /url: https://github.com/yandex-cloud/yandex-ai-studio-sdk/blob/master/compat/yandex-cloud-ml-sdk/MIGRATION.md
                  - text: the Yandex ML SDK to Yandex Cloud ML SDK.
                - heading "Release as of 26/01/2026" [level=2] [ref=f10e606]:
                  - link [ref=f10e607] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#260126
                    - text: "#"
                    - generic [ref=f10e608]: Release as of 26/01/2026
                  - text: Release as of 26/01/2026
                - paragraph [ref=f10e609]: The AI Assistant API functionality is discontinued and no longer available.
                - heading "Release as of 22/01/2026" [level=2] [ref=f10e610]:
                  - link [ref=f10e611] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#220126
                    - text: "#"
                    - generic [ref=f10e612]: Release as of 22/01/2026
                  - text: Release as of 22/01/2026
                - paragraph [ref=f10e613]:
                  - text: Added support for the
                  - link "Conversations API" [ref=f10e614] [cursor=pointer]:
                    - /url: en/ai-studio/api/Conversations/
                  - text: for flexible management of conversation context.
                - heading "Release as of 21/01/2026" [level=2] [ref=f10e615]:
                  - link [ref=f10e616] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#210126
                    - text: "#"
                    - generic [ref=f10e617]: Release as of 21/01/2026
                  - text: Release as of 21/01/2026
                - paragraph [ref=f10e618]:
                  - text: Added support for the
                  - link "Yandex SpeechKit" [ref=f10e619] [cursor=pointer]:
                    - /url: en/speechkit/tts/
                  - text: synthesis service in Yandex Cloud ML SDK.
                - heading "Release as of 25/11/2025" [level=2] [ref=f10e620]:
                  - link [ref=f10e621] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#251125
                    - text: "#"
                    - generic [ref=f10e622]: Release as of 25/11/2025
                  - text: Release as of 25/11/2025
                - paragraph [ref=f10e623]:
                  - text: Alice AI LLM is now available in the
                  - link "common instance" [ref=f10e624] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models#generation
                  - text: for all AI Studio users. Same as YandexGPT Pro, Yandex's new model is really good with RAG scenarios, but it is by far a much better free dialog partner, which makes it a model of choice for AI agents.
                - heading "Release as of 10/11/2025" [level=2] [ref=f10e625]:
                  - link [ref=f10e626] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#101125
                    - text: "#"
                    - generic [ref=f10e627]: Release as of 10/11/2025
                  - text: Release as of 10/11/2025
                - paragraph [ref=f10e628]:
                  - text: You can no longer deploy the gpt-oss-20b and gpt-oss-120b models in dedicated instances. These models remain available in the
                  - link "common instance" [ref=f10e629] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models#generation
                  - text: .
                - heading "Release as of 07/11/2025" [level=2] [ref=f10e630]:
                  - link [ref=f10e631] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#071125
                    - text: "#"
                    - generic [ref=f10e632]: Release as of 07/11/2025
                  - text: Release as of 07/11/2025
                - paragraph [ref=f10e633]:
                  - text: Added support for
                  - link "Yandex Search API" [ref=f10e634] [cursor=pointer]:
                    - /url: en/search-api/
                  - text: in Yandex Cloud ML SDK.
                - heading "Release as of 02/10/2025" [level=2] [ref=f10e635]:
                  - link [ref=f10e636] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#release-as-of-02/10/2025
                    - text: "#"
                    - generic [ref=f10e637]: Release as of 02/10/2025
                  - text: Release as of 02/10/2025
                - paragraph [ref=f10e638]: The Llama 8B and Llama 70B models are no longer supported in the common instance.
                - heading "Release as of 24/09/2025" [level=2] [ref=f10e639]:
                  - link [ref=f10e640] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#240925
                    - text: "#"
                    - generic [ref=f10e641]: Release as of 24/09/2025
                  - text: Release as of 24/09/2025
                - paragraph [ref=f10e642]: "Yandex Foundation Models has evolved into Yandex Cloud AI Studio, a full-value generative model and AI agent platform. There are some further updates:"
                - list [ref=f10e643]:
                  - listitem [ref=f10e644]: Our voice assistants and the Realtime API you need to use them are now available at the Preview stage.
                  - listitem [ref=f10e645]: MCP Hub is now available from the management console. The feature is at the Preview stage.
                  - listitem [ref=f10e646]: Extended compatibility with the OpenAI API. Added support for the Responses API, Realtime API, and Vector Store API.
                  - listitem [ref=f10e647]: Agent Atelier, the agent constructor, is now available from the management console.
                  - listitem [ref=f10e648]: Added the option to manage Vector Store search indexes and search files from the management console.
                  - listitem [ref=f10e649]: The AI agents with the main tools for the Responses API and Vector Store API have now entered the General Availability stage. The AI Assistant API is still there but will not be developed further. Use the Responses API for your new projects.
                - heading "Release as of 19/09/2025" [level=2] [ref=f10e650]:
                  - link [ref=f10e651] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#190925
                    - text: "#"
                    - generic [ref=f10e652]: Release as of 19/09/2025
                  - text: Release as of 19/09/2025
                - paragraph [ref=f10e653]: In the management console, users without a billing account will no longer enjoy free requests to YandexGPT and YandexART.
                - heading "Release as of 16/09/2025" [level=2] [ref=f10e654]:
                  - link [ref=f10e655] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#160925
                    - text: "#"
                    - generic [ref=f10e656]: Release as of 16/09/2025
                  - text: Release as of 16/09/2025
                - paragraph [ref=f10e657]:
                  - text: Added the ability to deploy some models on
                  - link "dedicated instances" [ref=f10e658] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/dedicated-instance
                  - text: .
                - heading "Release as of 03/09/2025" [level=2] [ref=f10e659]:
                  - link [ref=f10e660] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#030925
                    - text: "#"
                    - generic [ref=f10e661]: Release as of 03/09/2025
                  - text: Release as of 03/09/2025
                - paragraph [ref=f10e662]:
                  - text: The
                  - link "common instance" [ref=f10e663] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models#generation
                  - text: now features the Gemma 3 27B visual-linguistic model. For text-to-text, access the model in AI Playground; for images, use the OpenAI API or AI Studio SDK.
                - heading "Release as of 28/08/2025" [level=2] [ref=f10e664]:
                  - link [ref=f10e665] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#280825
                    - text: "#"
                    - generic [ref=f10e666]: Release as of 28/08/2025
                  - text: Release as of 28/08/2025
                - list [ref=f10e667]:
                  - listitem [ref=f10e668]:
                    - text: The YandexGPT Pro 5.1 model is available for testing (
                    - button "RC" [ref=f10e669]
                    - text: branch). The new model does not support the reasoning mode.
                  - listitem [ref=f10e670]: Discontinued support for version 4 of the YandexGPT Pro, YandexGPT Pro 32k, YandexGPT Lite models, and models fine-tuned on YandexGPT Lite version 4.
                - heading "Release as of 06/08/2025" [level=2] [ref=f10e671]:
                  - link [ref=f10e672] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#060825
                    - text: "#"
                    - generic [ref=f10e673]: Release as of 06/08/2025
                  - text: Release as of 06/08/2025
                - paragraph [ref=f10e674]: The OpenAI gpt-oss-120b and gpt-oss-20b models are now available in synchronous mode via the OpenAI API. These models are good at reasoning, but do not yet support function calling.
                - heading "Release as of 24/07/2025" [level=2] [ref=f10e675]:
                  - link [ref=f10e676] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#240725
                    - text: "#"
                    - generic [ref=f10e677]: Release as of 24/07/2025
                  - text: Release as of 24/07/2025
                - paragraph [ref=f10e678]: Updated the Qwen3 235B model by increasing its context length to 256,000 tokens.
                - heading "Release as of 03/07/2025" [level=2] [ref=f10e679]:
                  - link [ref=f10e680] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#030725
                    - text: "#"
                    - generic [ref=f10e681]: Release as of 03/07/2025
                  - text: Release as of 03/07/2025
                - paragraph [ref=f10e682]: Qwen3 235B is now available in synchronous mode. The model works only through the OpenAI API.
                - heading "Release as of 15/05/2025" [level=2] [ref=f10e683]:
                  - link [ref=f10e684] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#150525
                    - text: "#"
                    - generic [ref=f10e685]: Release as of 15/05/2025
                  - text: Release as of 15/05/2025
                - paragraph [ref=f10e686]:
                  - text: In line with the lifecycle, updated the
                  - link "text generation model" [ref=f10e687] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models#generation
                  - text: versions available in synchronous and asynchronous mode. Discontinued support of YandexGPT version 3 models and models fine-tuned in Yandex DataSphere.
                - heading "Release as of 30/04/2025" [level=2] [ref=f10e688]:
                  - link [ref=f10e689] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#290425
                    - text: "#"
                    - generic [ref=f10e690]: Release as of 30/04/2025
                  - text: Release as of 30/04/2025
                - paragraph [ref=f10e691]: New text models of the Qwen3 family are now available in batch mode.
                - heading "Release as of 24/04/2025" [level=2] [ref=f10e692]:
                  - link [ref=f10e693] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#240425
                    - text: "#"
                    - generic [ref=f10e694]: Release as of 24/04/2025
                  - text: Release as of 24/04/2025
                - paragraph [ref=f10e695]: Vision language models are now available in AI Studio.
                - paragraph [ref=f10e696]:
                  - text: Added the
                  - link "batch mode" [ref=f10e697] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/#working-mode
                  - text: "for working with models: now you can process large amounts of data with a single request. The batch mode is supported for"
                  - link "text generation models" [ref=f10e698] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models#batch
                  - text: and vision language models. Added new types of
                  - link "datasets" [ref=f10e699] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/resources/dataset
                  - text: to use in batch mode.
                - heading "Release as of 31/03/2025" [level=2] [ref=f10e700]:
                  - link [ref=f10e701] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#310325
                    - text: "#"
                    - generic [ref=f10e702]: Release as of 31/03/2025
                  - text: Release as of 31/03/2025
                - list [ref=f10e703]:
                  - listitem [ref=f10e704]:
                    - text: The
                    - button "RC" [ref=f10e705]
                    - text: branch now features the YandexGPT Lite 5th generation model, which supports contexts of up to 32,000 tokens in both synchronous and asynchronous modes.
                  - listitem [ref=f10e706]: Added support for OpenAI tools to work with text generation models.
                - heading "Release as of 19/03/2025" [level=2] [ref=f10e707]:
                  - link [ref=f10e708] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#190325
                    - text: "#"
                    - generic [ref=f10e709]: Release as of 19/03/2025
                  - text: Release as of 19/03/2025
                - paragraph [ref=f10e710]:
                  - text: "Increased some limits for AI Assistant API: now you can add up to 10,000 documents with the total size of 5 million tokens to a search index. You can upload up to 100 documents at a time. Also, increased the maximum number of threads to 10,000 and maximum number of messages per thread to 100,000. For a complete list of limits, see"
                  - link "Yandex Cloud AI Studio quotas and limits" [ref=f10e711] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/limits
                  - text: .
                - heading "Release as of 25/02/2025" [level=2] [ref=f10e712]:
                  - link [ref=f10e713] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#250225
                    - text: "#"
                    - generic [ref=f10e714]: Release as of 25/02/2025
                  - text: Release as of 25/02/2025
                - paragraph [ref=f10e715]:
                  - text: The YandexGPT Pro 5th generation model is now available for testing in the
                  - button "RC" [ref=f10e716]
                  - text: "branch. The 5th generation key upgrades include:"
                - list [ref=f10e717]:
                  - listitem [ref=f10e718]:
                    - link "Function calling" [ref=f10e719] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/function-call
                    - text: was significantly improved.
                  - listitem [ref=f10e720]:
                    - text: Added support for structured output. This feature enables you to set up the model to generate responses in random JSON format or according to the provided schema. For more information on structuring model output, see
                    - link "Text generation overview" [ref=f10e721] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/#answers-formatting
                    - text: .
                  - listitem [ref=f10e722]: Increased the supported context to 32,000 tokens for all modes.
                - heading "Release as of 11/02/25" [level=2] [ref=f10e723]:
                  - link [ref=f10e724] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#110225
                    - text: "#"
                    - generic [ref=f10e725]: Release as of 11/02/25
                  - text: Release as of 11/02/25
                - list [ref=f10e726]:
                  - listitem [ref=f10e727]:
                    - text: Updated the
                    - link "Llama 70B" [ref=f10e728] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/models
                    - text: model version. Now Llama 3.3. Llama was created by Meta. Meta is designated as an extremist organization and its activities are prohibited in Russia. is available in all branches.
                  - listitem [ref=f10e729]:
                    - text: "A new version is out: ML SDK 0.3.1. It features the following updates:"
                    - list [ref=f10e730]:
                      - listitem [ref=f10e731]: Python 3.8 is no longer supported.
                      - listitem [ref=f10e732]: Added the multipart mode for uploading large datasets.
                      - listitem [ref=f10e733]:
                        - text: Added the
                        - button "allow_data_logging" [ref=f10e734]
                        - text: option that allows you to use dataset data to improve the tuning service when loading datasets.
                      - listitem [ref=f10e735]:
                        - text: Added the
                        - button "validation_errors" [ref=f10e736]
                        - text: field that stores dataset validation errors.
                      - listitem [ref=f10e737]:
                        - text: Replaced the
                        - button "grpc_credentials" [ref=f10e738]
                        - text: field with
                        - button "verify" [ref=f10e739]
                        - text: in the SDK builder.
                - heading "Release as of 07/02/25" [level=2] [ref=f10e740]:
                  - link [ref=f10e741] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#070225
                    - text: "#"
                    - generic [ref=f10e742]: Release as of 07/02/25
                  - text: Release as of 07/02/25
                - paragraph [ref=f10e743]:
                  - text: Added support for the
                  - link "reasoning mode" [ref=f10e744] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/chain-of-thought
                  - text: in the YandexGPT Pro model.
                - heading "Release as of 09/12/24" [level=2] [ref=f10e745]:
                  - link [ref=f10e746] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#091224
                    - text: "#"
                    - generic [ref=f10e747]: Release as of 09/12/24
                  - text: Release as of 09/12/24
                - paragraph [ref=f10e748]:
                  - text: LoRA-based model and classifier
                  - link "fine-tuning" [ref=f10e749] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/tuning/
                  - text: is now available on request in Preview.
                - paragraph [ref=f10e750]: YandexGPT-based classifiers are now publicly available.
                - heading "Release as of 04/12/24" [level=2] [ref=f10e751]:
                  - link [ref=f10e752] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#041224
                    - text: "#"
                    - generic [ref=f10e753]: Release as of 04/12/24
                  - text: Release as of 04/12/24
                - paragraph [ref=f10e754]:
                  - link "Llama 3.1 models" [ref=f10e755] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models
                  - text: are now available in AI Studio. For model usage costs, see
                  - link "Yandex Cloud AI Studio pricing policy" [ref=f10e756] [cursor=pointer]:
                    - /url: en/ai-studio/pricing
                  - text: .
                - heading "Release as of 02/12/24" [level=2] [ref=f10e757]:
                  - link [ref=f10e758] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#021224
                    - text: "#"
                    - generic [ref=f10e759]: Release as of 02/12/24
                  - text: Release as of 02/12/24
                - paragraph [ref=f10e760]:
                  - text: The YandexGPT 4th generation model is now available in the main branch (
                  - button "Latest" [ref=f10e761]
                  - text: ). Version 3 will remain available in the
                  - button "Deprecated" [ref=f10e762]
                  - text: branch as per the models'
                  - link "lifecycle" [ref=f10e763] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/models#model-lifecycle
                  - text: .
                - heading "Release as of 21/11/24" [level=2] [ref=f10e764]:
                  - link [ref=f10e765] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#211124
                    - text: "#"
                    - generic [ref=f10e766]: Release as of 21/11/24
                  - text: Release as of 21/11/24
                - paragraph [ref=f10e767]: The AI Assistant API functionality is now available to all Yandex Cloud AI Studio users at the Preview stage.
                - heading "Release as of 01/11/24" [level=2] [ref=f10e768]:
                  - link [ref=f10e769] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#011124
                    - text: "#"
                    - generic [ref=f10e770]: Release as of 01/11/24
                  - text: Release as of 01/11/24
                - list [ref=f10e771]:
                  - listitem [ref=f10e772]:
                    - text: Image generation with YandexART is now publicly available. Starting November 1, 2024, YandexART is billed as per the rules described on the
                    - link "AI Studio pricing policy" [ref=f10e773] [cursor=pointer]:
                      - /url: en/ai-studio/pricing#rules-image-generation
                    - text: page.
                  - listitem [ref=f10e774]: Increased the YandexART quotas for the number of generation requests per minute and full day (24 hours).
                  - listitem [ref=f10e775]:
                    - text: Increased the YandexGPT quota for the number of concurrent generations. For information on the restrictions in place, refer to
                    - link "Yandex Cloud AI Studio quotas and limits" [ref=f10e776] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/limits
                    - text: .
                  - listitem [ref=f10e777]:
                    - text: Starting December 2, 2024, the YandexGPT model's test version (
                    - button "RC" [ref=f10e778]
                    - text: branch) will become the main version (
                    - button "Latest" [ref=f10e779]
                    - text: branch). The current version will remain available in the
                    - button "Deprecated" [ref=f10e780]
                    - text: branch as per the models'
                    - link "lifecycle" [ref=f10e781] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/models#model-lifecycle
                    - text: .
                - heading "Release as of 24/10/2024" [level=2] [ref=f10e782]:
                  - link [ref=f10e783] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#241024
                    - text: "#"
                    - generic [ref=f10e784]: Release as of 24/10/2024
                  - text: Release as of 24/10/2024
                - list [ref=f10e785]:
                  - listitem [ref=f10e786]:
                    - text: The YandexGPT 4th generation model is available for testing (
                    - button "RC" [ref=f10e787]
                    - text: branch). Compared to the previous generation, the model's response speed has increased by an average of 2.5 times. The maximum context the model operates has also been increased. In asynchronous mode, 4th generation models can process up to 32,000 tokens. And now there is the YandexGPT Pro 32k model added to process large contexts in synchronous mode. For more information on model limitations, see
                    - link "Yandex Cloud AI Studio quotas and limits" [ref=f10e788] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/limits
                    - text: .
                  - listitem [ref=f10e789]: Increased the maximum number of tokens per response in the management console.
                - heading "Release as of 10/10/24" [level=2] [ref=f10e790]:
                  - link [ref=f10e791] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#101024
                    - text: "#"
                    - generic [ref=f10e792]: Release as of 10/10/24
                  - text: Release as of 10/10/24
                - paragraph [ref=f10e793]: Updated the YandexART model. The updated version has better understanding of prompts, considers more details, and can generate text in Latin characters on the image.
                - heading "Release as of 21/06/24" [level=2] [ref=f10e794]:
                  - link [ref=f10e795] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#210624
                    - text: "#"
                    - generic [ref=f10e796]: Release as of 21/06/24
                  - text: Release as of 21/06/24
                - paragraph [ref=f10e797]:
                  - text: Starting June 24, 2024, the YandexGPT Lite model based on YandexGPT 3 is available by default (
                  - button "latest" [ref=f10e798]
                  - text: branch). The deprecated model based on YandexGPT 2 is available in the
                  - button "deprecated" [ref=f10e799]
                  - text: branch until July 1, 2024.
                - heading "Release as of 07/06/24" [level=2] [ref=f10e800]:
                  - link [ref=f10e801] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#070624
                    - text: "#"
                    - generic [ref=f10e802]: Release as of 07/06/24
                  - text: Release as of 07/06/24
                - paragraph [ref=f10e803]: "Updated the YandexART model:"
                - list [ref=f10e804]:
                  - listitem [ref=f10e805]: Compared to the previous version, the updated model understands text prompts better and creates more realistic images.
                  - listitem [ref=f10e806]:
                    - text: Added the optional
                    - button "aspectRatio" [ref=f10e807]
                    - text: parameter for the image aspect ratio.
                - heading "Release as of 29/05/24" [level=2] [ref=f10e808]:
                  - link [ref=f10e809] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#280524
                    - text: "#"
                    - generic [ref=f10e810]: Release as of 29/05/24
                  - text: Release as of 29/05/24
                - paragraph [ref=f10e811]:
                  - text: Added the
                  - link "text classification" [ref=f10e812] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/classifier/
                  - text: feature.
                - heading "Release as of 28/05/24" [level=2] [ref=f10e813]:
                  - link [ref=f10e814] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#280524
                    - text: "#"
                    - generic [ref=f10e815]: Release as of 28/05/24
                  - text: Release as of 28/05/24
                - paragraph [ref=f10e816]: The YandexGPT 3-based YandexGPT Lite RC model is now available in Release Candidate status. The model may replace the current YandexGPT Lite in the future.
                - heading "Release as of 19/04/24" [level=2] [ref=f10e817]:
                  - link [ref=f10e818] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#190424
                    - text: "#"
                    - generic [ref=f10e819]: Release as of 19/04/24
                  - text: Release as of 19/04/24
                - paragraph [ref=f10e820]: Now you can send asynchronous requests to YandexGPT models fine-tuned in DataSphere.
                - heading "Release as of 09/04/24" [level=2] [ref=f10e821]:
                  - link [ref=f10e822] [cursor=pointer]:
                    - /url: en/ai-studio/release-notes/#090424
                    - text: "#"
                    - generic [ref=f10e823]: Release as of 09/04/24
                  - text: Release as of 09/04/24
                - list [ref=f10e824]:
                  - listitem [ref=f10e825]:
                    - text: Added the generation of images based on a text description. The YandexART model works in asynchronous mode and is available in the management console in AI Playground and via the
                    - link "API" [ref=f10e826] [cursor=pointer]:
                      - /url: en/ai-studio/image-generation/api-ref/
                    - text: .
                  - listitem [ref=f10e827]: Added examples of requests to a YandexART model to the guide.
