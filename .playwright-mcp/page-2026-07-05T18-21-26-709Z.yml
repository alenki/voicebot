              - paragraph [ref=f15e995]: Requests with less than one billing unit are rounded up to the next integer. Large texts are billed as multiple requests with rounding up.
              - blockquote [ref=f15e996]:
                - paragraph [ref=f15e997]:
                  - text: For example, classifying a text of 770 tokens with YandexGPT Lite will be billed as a single request, i.e., as one billing unit.
