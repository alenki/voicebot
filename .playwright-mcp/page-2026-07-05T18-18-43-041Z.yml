                - generic [ref=f11e496]: Overview of Yandex Cloud AI Studio AI models
              - generic [ref=f11e497]:
                - paragraph [ref=f11e498]: "Yandex Cloud AI Studio provides powerful capabilities for the use of generative models in business scenarios:"
                - list [ref=f11e499]:
                  - listitem [ref=f11e500]:
                    - text: Native and open-source
                    - link "common instance" [ref=f11e501] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/models#generation
                    - text: models
                    - link "billed" [ref=f11e502] [cursor=pointer]:
