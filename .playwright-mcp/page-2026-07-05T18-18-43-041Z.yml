                    - text: based on consumed
                    - link "tokens" [ref=f11e503] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/tokens
                    - text: .
                  - listitem [ref=f11e504]:
                    - text: LoRA-based model
                    - link "fine-tuning" [ref=f11e505] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/tuning/
                    - text: .
                  - listitem [ref=f11e506]:
                    - text: Out-of-the-box and tunable text
                    - link "classification" [ref=f11e507] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/classifier/
                    - text: models.
                  - listitem [ref=f11e508]:
                    - text: Large selection of
                    - link "text" [ref=f11e509] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/models#text-batch
                    - text: and
                    - link "multimodal" [ref=f11e510] [cursor=pointer]:
                      - /url: en/ai-studio/concepts/generation/models#multimodels-batch
                    - text: open-source models to batch-process large volumes of data with a
                    - link "prepaid minimum amount of tokens" [ref=f11e511] [cursor=pointer]:
                      - /url: en/ai-studio/pricing#rules-generating
                    - text: .
                  - listitem [ref=f11e512]: Dedicated model instances, if you are looking to process large volumes of data with guaranteed response time.
                - paragraph [ref=f11e513]:
                  - text: "There are two interfaces you can use to work with models: AI Playground in the AI Studio UI and various APIs where you can"
                  - link "create agents" [ref=f11e514] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/agents/
                  - text: and access models directly.
                - heading "Native Yandex models" [level=2] [ref=f11e515]:
                  - link [ref=f11e516] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/#yandex
                    - text: "#"
                    - generic [ref=f11e517]: Native Yandex models
                  - text: Native Yandex models
                - paragraph [ref=f11e518]: Model Gallery brings to you Yandex's text and image generation models you can use for your business.
                - paragraph [ref=f11e519]: The smallest and fastest one among the text models, YandexGPT Lite excels at tasks that prioritize response speed over complex reasoning or in-depth knowledge of sophisticated subject areas. For example, you can use YandexGPT Lite to categorize incoming user messages, format texts, or summarize your meetings.
                - paragraph [ref=f11e520]: "YandexGPT Pro will perform well in more complex tasks: searching knowledge bases and generating results based on the output (RAG scenario), document analysis, reporting and analytics, data extraction and auto-population of fields, forms, and CRM databases."
                - paragraph [ref=f11e521]:
                  - text: Alice AI LLM, Yandex's new flagship model, is not only head-to-head with YandexGPT Pro in complex tasks, but also a much better dialog partner in chat scenarios, capable of extracting information from the whole context. Alice AI LLM will be ideal for creating
                  - emphasis [ref=f11e522]: human-oriented
                  - text: AI assistants.
                - paragraph [ref=f11e523]:
                  - text: Yandex text models can understand around 20 languages, including English and Japanese, their primary focus is to be an effective processing engine for texts in Russian. With Yandex's proprietary
                  - link "tokenizer" [ref=f11e524] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/tokens
                  - text: ", its models are more efficient with tokens than other models out there, thus saving you money. For an"
                  - link "example calculation" [ref=f11e525] [cursor=pointer]:
                    - /url: en/ai-studio/pricing#example-generating
                  - text: of the cost of doing the same task using different models, see the
                  - link "pricing page" [ref=f11e526] [cursor=pointer]:
                    - /url: en/ai-studio/pricing#text-sync-async
                  - text: .
                - paragraph [ref=f11e527]:
                  - text: Apart from text models, Model Gallery also features the YandexART model, a generative neural network that creates images based on a text query. YandexART uses the cascaded diffusion method to iteratively refine images from noise. You can specify the format of the final image in the
                  - button "mime_type" [ref=f11e528]
                  - text: parameter. Currently, the supported value is
                  - button "image/jpeg" [ref=f11e529]
                  - text: . By default, YandexART generates an image of 1024 x 1024 pixels. This size may increase or decrease based on the specified aspect ratio, but by no more than 10%.
                - paragraph [ref=f11e530]:
                  - text: Yandex text models are available through the OpenAI-compatible Completions API and Responses API, as well as a proprietary
                  - link "REST" [ref=f11e531] [cursor=pointer]:
                    - /url: en/ai-studio/text-generation/api-ref/
                  - text: and
                  - link "gRPC" [ref=f11e532] [cursor=pointer]:
                    - /url: en/ai-studio/text-generation/api-ref/grpc/
                  - text: text generation API.
                  - text: YandexART provides a proprietary image generation API, also available as
                  - link "REST" [ref=f11e533] [cursor=pointer]:
                    - /url: en/ai-studio/image-generation/api-ref/
                  - text: and
                  - link "gRPC" [ref=f11e534] [cursor=pointer]:
                    - /url: en/ai-studio/image-generation/api-ref/grpc/
                  - text: .
                - paragraph [ref=f11e535]:
                  - text: Moreover, all the models can be reached through ML SDK and
                  - link "AI Playground" [ref=f11e536] [cursor=pointer]:
                    - /url: https://console.yandex.cloud/link/ai-studio/
                  - text: .
                - heading "AI Studio operating modes" [level=2] [ref=f11e537]:
                  - link [ref=f11e538] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/#working-mode
                    - text: "#"
                    - generic [ref=f11e539]: AI Studio operating modes
                  - text: AI Studio operating modes
                - paragraph [ref=f11e540]:
                  - text: "In AI Studio, you can use models in three modes:"
                  - emphasis [ref=f11e541]: synchronous
                  - text: ","
                  - emphasis [ref=f11e542]: asynchronous
                  - text: ", or"
                  - emphasis [ref=f11e543]: batch
                  - text: mode. The modes have different response times and operating logic.
                - paragraph [ref=f11e544]:
                  - text: "In synchronous mode, the model gets your request and returns the result immediately after processing. The response delay in synchronous mode is minimal but not instant: the model still needs some time, which depends on the model and system workload. With the"
                  - button "stream" [ref=f11e545]
                  - text: option enabled, the model sends intermediate generation results during the process. You may opt for synchronous mode if you need to maintain a chatbot dialog. In synchronous mode, models are available in AI Playground, ML SDK, via text generation APIs, and OpenAI-compatible APIs.
                - paragraph [ref=f11e546]:
                  - text: In asynchronous mode, the model responds to a request by sending an
                  - link "Operation object" [ref=f11e547] [cursor=pointer]:
                    - /url: https://yandex.cloud/en/docs/api-design-guide/concepts/operation
                  - text: containing the ID of the operation it is performing. You can use the ID to learn the status of the request and later get the result of it by submitting a request to a special output endpoint (its value depends on the model). Intermediate generation results are not available in asynchronous mode. In asynchronous mode, generation usually takes longer (from a couple of minutes to several hours) than in synchronous mode but is cheaper. Use asynchronous mode if you do not need an urgent response. In asynchronous mode, some models are available in ML SDK, via text generation APIs, and image generation APIs.
                - paragraph [ref=f11e548]:
                  - text: Batch processing mode allows you to process a large data array in a single request to the model. Input data is provided as a
                  - link "dataset" [ref=f11e549] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/resources/dataset
                  - text: whose type depends on the model. For each request, AI Studio runs an individual instance of the model to process the dataset and then stops it. The result is saved as another dataset, which you can download in
                  - link "Parquet" [ref=f11e550] [cursor=pointer]:
                    - /url: https://parquet.apache.org/
                  - text: format or use immediately, e.g., to tune another model. It may take several hours to generate the result. You can process data in batch mode in the AI Studio UI, using ML SDK, or via the Batch API. For the list of models available in batch mode, see
                  - link "Batch processing" [ref=f11e551] [cursor=pointer]:
                    - /url: en/ai-studio/concepts/generation/batch-processing
                  - text: .
                - heading "See also" [level=4] [ref=f11e552]:
