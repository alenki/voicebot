        - heading "Как пройти идентификацию клиентам Рег.облака" [level=1] [ref=f6e88]
      - generic [ref=f6e89]:
        - article [ref=f6e91]:
          - paragraph [ref=f6e92]: С 1 декабря 2023 года для повышения безопасности интернета законодательством РФ установлено, что услуги хостинга (облачные серверы, облачные базы данных, кластеры Kubernetes, объектное хранилище S3, физические выделенные серверы) могут быть предоставлены только клиентам, прошедшим идентификацию.
          - paragraph [ref=f6e93]: В Рег.облаке вы можете пройти идентификацию одним из способов, перечисленных ниже.
          - generic [ref=f6e96]:
            - paragraph [ref=f6e97]: Важно
            - paragraph [ref=f6e98]:
              - text: Перед прохождением идентификации обязательно заполните
              - link "контактные данные владельца аккаунта" [ref=f6e99] [cursor=pointer]:
                - /url: https://help.reg.ru/support/lichnyy-kabinet/registratsiya-i-kontaktnyye-dannyye/kontaktnyye-dannyye-vladeltsa-akkaunta#0
              - text: в личном кабинете Рег.ру. Если этого не сделать, идентификация не будет пройдена.
          - heading "Идентификация через Госуслуги" [level=2] [ref=f6e100]
          - generic [ref=f6e103]:
            - paragraph [ref=f6e104]: Обратите внимание
            - paragraph [ref=f6e105]: Этот способ идентификации доступен, только если ваша учетная запись на Госуслугах подтверждена. Проверить это можно в вашем профиле на Госуслугах.
          - paragraph [ref=f6e106]: "Чтобы пройти идентификацию хостинга с помощью Госуслуг:"
          - list [ref=f6e108]:
            - listitem [ref=f6e109]:
              - generic [ref=f6e110]: "1"
              - generic [ref=f6e112]:
                - text: Авторизуйтесь
                - link "в личном кабинете Рег.ру" [ref=f6e113] [cursor=pointer]:
                  - /url: https://www.reg.ru/user/account/#/
                - text: .
            - listitem [ref=f6e114]:
              - generic [ref=f6e115]: "2"
              - generic [ref=f6e117]:
                - text: Перейдите
                - link "в раздел «Настройки»" [ref=f6e118] [cursor=pointer]:
                  - /url: https://www.reg.ru/user/account/#/settings/info/
                - text: .
            - listitem [ref=f6e119]:
              - generic [ref=f6e120]: "3"
              - generic [ref=f6e122]:
                - paragraph [ref=f6e123]: "В блоке «Контакты владельца аккаунта» нажмите «Пройти идентификацию» (если у вас не заполнены контактные данные, нажмите «Заполнить через Госуслуги»):"
                - paragraph
                - paragraph
            - listitem [ref=f6e128]:
              - generic [ref=f6e129]: "4"
              - generic [ref=f6e130]: Авторизуйтесь на сайте Госуслуг и предоставьте права доступа для «Рег.ру Домены Хостинг».
          - paragraph [ref=f6e132]:
            - text: Готово, ожидайте результата идентификации. Статус идентификации будет отражен в личном кабинете Рег.ру на странице
            - strong [ref=f6e133]: Настройки > Контакты владельца аккаунта
            - text: . Также вы получите уведомление на email.
          - paragraph [ref=f6e134]:
            - text: Если данные в договоре Рег.ру отличаются от данных учетной записи на Госуслугах, идентификация будет отклонена и вам потребуется предоставить электронные копии документов
            - link "по инструкции" [ref=f6e135] [cursor=pointer]:
              - /url: "#4"
            - text: .
          - heading "Пополнение лицевого счета с банковской карты или через СБП" [level=2] [ref=f6e136]
          - paragraph [ref=f6e137]: "Вы можете пройти идентификацию хостинга при пополнении баланса аккаунта или оплате услуг с банковской карты или через «Систему быстрых платежей». Для этого:"
