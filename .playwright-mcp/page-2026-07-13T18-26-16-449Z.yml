              - generic [ref=f2e215]:
                - text: Проверьте настройки и нажмите
                - strong [ref=f2e216]: Создать сервер
                - text: .
          - paragraph [ref=f2e217]: Сервер будет создан в течение нескольких минут. Данные для подключения будут отправлены на адрес электронной почты, указанный при регистрации.
          - generic [ref=f2e220]:
            - paragraph [ref=f2e221]: Обратите внимание
            - paragraph [ref=f2e222]: Заказ дополнительных публичных IP-адресов и управление сетями недоступны на тарифе Free Tier.
          - heading "Ограничения" [level=2] [ref=f2e223]
          - paragraph [ref=f2e224]: "При использовании Free Tier действуют следующие технические и сервисные ограничения:"
          - list [ref=f2e226]:
            - listitem [ref=f2e227]:
              - paragraph [ref=f2e228]:
                - strong [ref=f2e229]: количество серверов
                - text: ": не более 1 сервера Free Tier на один аккаунт;"
            - listitem [ref=f2e230]:
              - paragraph [ref=f2e231]:
                - strong [ref=f2e232]: сетевые ограничения
                - text: ": дополнительные IP-адреса заказать нельзя. Управление сетями (создание подсетей, роутеров) и подключение к приватным сетям доступно только на платных тарифах;"
            - listitem [ref=f2e233]:
              - paragraph [ref=f2e234]:
                - strong [ref=f2e235]: пропускная способность (bandwidth)
                - text: ": ограничена 20 Мбит/с для публичной и приватной сетей;"
            - listitem [ref=f2e236]:
              - paragraph [ref=f2e237]:
                - strong [ref=f2e238]: ресурсы
                - text: ": увеличение ресурсов (количество ядер виртуального процессора, объем оперативной памяти, дисковое пространство) без перехода на платный тариф невозможно;"
            - listitem [ref=f2e239]:
              - paragraph [ref=f2e240]:
                - strong [ref=f2e241]: дополнительные услуги
                - text: ": все дополнительные услуги (моментальные снимки сервера, резервное копирование, расширенная защита от DDoS-атак и др.) кроме публичного IP-адреса, предоставляются за дополнительную плату согласно тарифам Рег.облака."
          - heading "После окончания бесплатного периода" [level=2] [ref=f2e242]
          - paragraph [ref=f2e243]: По истечении 6 месяцев с момента активации первого бесплатного сервера происходит автоматическое переключение на платную тарификацию. Ваш облачный сервер и привязанный к нему публичный IP-адрес переводятся на стандартные платные тарифы.
          - paragraph [ref=f2e244]: "Переход осуществляется на тариф «Stdp C1-M1-D10» со следующими характеристиками: 1 ядро виртуального процессора (CPU) с частотой 2,2 ГГц, 1 ГБ оперативной памяти DDR4, 10 ГБ дискового пространства на SSD-накопителе с интерфейсом NVMe."
          - paragraph [ref=f2e245]:
            - text: Стоимость тарифа можно посмотреть
            - link "по ссылке" [ref=f2e246] [cursor=pointer]:
              - /url: https://reg.cloud/support/cloud/billing/stoimost-uslug-iaas-v-publichnom-oblake-reg-ru
            - text: .
          - paragraph [ref=f2e247]: "Дальнейший сценарий зависит от состояния баланса:"
          - list [ref=f2e249]:
            - listitem [ref=f2e250]:
              - paragraph [ref=f2e251]:
                - text: если
                - strong [ref=f2e252]: баланс положительный
                - text: — сервер продолжает работать в обычном режиме. Списание средств происходит согласно платным тарифам;
            - listitem [ref=f2e253]:
              - paragraph [ref=f2e254]:
                - text: если
                - strong [ref=f2e255]: средств для продления тарифа недостаточно
                - text: — сервер автоматически приостанавливается. Вы можете пополнить баланс для возобновления работы.
          - paragraph [ref=f2e256]:
            - strong [ref=f2e257]: Удаление
            - text: ": если баланс остается отрицательным, сервер приостанавливается на 7 дней. В течение этого времени необходимо пополнить баланс. Если средства достаточные для продления тарифа не поступили, сервер удаляется без возможности восстановления."
          - paragraph [ref=f2e258]: Исключение — восстановление из резервной копии, если она создавалась как платная услуга и на ее оплату достаточно средств.
          - heading "Удаление сервера" [level=2] [ref=f2e259]
