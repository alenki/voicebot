                - text: Укажите имя сервера, который вы удаляете, и нажмите
                - strong [ref=f2e286]: Удалить сервер
                - text: .
          - paragraph [ref=f2e287]: После удаления сервера вы можете создать новый сервер Free Tier, если не истек 6-месячный период с момента первой активации сервиса. Если 6 месяцев прошли, создание нового бесплатного сервера станет недоступно.
