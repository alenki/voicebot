      - generic [ref=f2e92]:
        - article [ref=f2e94]:
          - heading "Что такое Free Tier" [level=2] [ref=f2e95]
          - paragraph [ref=f2e96]:
            - strong [ref=f2e97]: Free Tier (Базовый бесплатный тариф)
            - text: — это бесплатный облачный сервер базовой конфигурации, который предоставляется на срок 6 месяцев с момента первой активации.
          - paragraph [ref=f2e98]: Услуга предназначена для знакомства с платформой, тестирования небольших проектов, запуска тестовой версии продукта (MVP), выполнения задач по внедрению подхода CI/CD, работы с Docker, а также для обучения и пет-проектов. Free Tier позволяет развернуть базовую инфраструктуру без затрат и оценить возможности облачной платформы.
          - heading "Ресурсы и возможности сервера" [level=2] [ref=f2e99]
          - paragraph [ref=f2e100]: "Сервер в рамках программы Free Tier (Базовый бесплатный тариф) предоставляется на базе тарифа «Стандартный +» со следующими параметрами:"
          - generic [ref=f2e103]:
            - generic [ref=f2e104]:
              - generic [ref=f2e105]: Параметр
              - generic [ref=f2e106]: Значение
            - generic [ref=f2e107]:
              - generic [ref=f2e108]: Количество ядер виртуального процессора (vCPU)
              - generic [ref=f2e109]: 1 ядро
            - generic [ref=f2e110]:
              - generic [ref=f2e111]: Объем оперативной памяти (RAM)
              - generic [ref=f2e112]: 1 ГБ
            - generic [ref=f2e113]:
              - generic [ref=f2e114]: Дисковое пространство (SSD)
              - generic [ref=f2e115]: 10 ГБ
            - generic [ref=f2e116]:
              - generic [ref=f2e117]: Публичный IP-адрес
              - generic [ref=f2e118]: 1 (включен в тариф)
            - generic [ref=f2e119]:
              - generic [ref=f2e120]: Сеть
              - generic [ref=f2e121]: Пропускная способность (bandwidth) 20 Мбит/с (для публичной и приватной сетей)
          - heading "Дополнительные возможности" [level=3] [ref=f2e122]
          - list [ref=f2e124]:
            - listitem [ref=f2e125]:
              - paragraph [ref=f2e126]:
                - strong [ref=f2e127]: Подключение дополнительных услуг
                - text: ": вы можете заказать моментальные снимки сервера (снэпшоты), резервное копирование и другие сервисы платформы;"
            - listitem [ref=f2e128]:
              - paragraph [ref=f2e129]:
                - strong [ref=f2e130]: масштабирование
                - text: ": при достижении лимитов конфигурации или после окончания бесплатного периода вы можете увеличить ресурсы сервера (количество ядер виртуального процессора, объем оперативной памяти, дисковое пространство) с автоматическим переходом на платный тариф. Перенос данных не требуется."
          - generic [ref=f2e133]:
            - paragraph [ref=f2e134]: Важно
            - paragraph [ref=f2e135]: Дополнительные услуги оплачиваются отдельно согласно тарифам Рег.облака.
          - heading "Условия получения бесплатного сервера" [level=2] [ref=f2e136]
          - paragraph [ref=f2e137]: "Для активации Free Tier необходимо соблюдение следующих условий:"
          - list [ref=f2e139]:
            - listitem [ref=f2e140]:
              - generic [ref=f2e141]: "1"
              - generic [ref=f2e143]:
                - strong [ref=f2e144]: Идентификация пользователя
                - text: ": услуга доступна только идентифицированным пользователям (физическим или юридическим лицам, прошедшим проверку документов). Пройти идентификацию можно"
                - link "по инструкции" [ref=f2e145] [cursor=pointer]:
                  - /url: https://reg.cloud/support/cloud/nachalo-raboty/kak-proyti-identifikatsiyu-kliyentam-reg-oblaka
                - text: в базе знаний Рег.облака.
          - list [ref=f2e147]:
            - listitem [ref=f2e148]:
              - generic [ref=f2e149]: "2"
              - generic [ref=f2e151]:
                - strong [ref=f2e152]: Положительный баланс
                - text: ": баланс лицевого счета в личном кабинете Рег.облака должен быть положительным. Рекомендуемый минимальный остаток — от 100 рублей. Это необходимо для активации услуг, которые тарифицируются поминутно. Пополнить баланс можно способами, описанными"
                - link "в статье" [ref=f2e153] [cursor=pointer]:
                  - /url: https://reg.cloud/support/cloud/billing/sposoby-oplaty-kak-vystavit-i-oplatit-schet-v-regoblake
                - text: .
          - generic [ref=f2e156]:
            - paragraph [ref=f2e157]: Обратите внимание
            - paragraph
            - paragraph [ref=f2e158]: "Программа доступна:"
            - list [ref=f2e160]:
              - listitem [ref=f2e161]:
                - paragraph [ref=f2e162]: пользователям, зарегистрировавшимся 13 апреля 2026 года или позднее;
              - listitem [ref=f2e163]:
                - paragraph [ref=f2e164]: пользователям, зарегистрировавшимся до 13 апреля 2026 года, но ни разу не заказывавшим услуги в Рег.облаке.
            - paragraph
          - heading "Как заказать сервер Free Tier" [level=2] [ref=f2e165]
          - paragraph [ref=f2e166]: "Пошаговая инструкция по созданию сервера Free Tier:"
