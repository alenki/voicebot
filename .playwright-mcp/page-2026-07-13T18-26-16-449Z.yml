                - text: .
            - listitem [ref=f2e189]:
              - generic [ref=f2e190]: "5"
              - generic [ref=f2e192]:
                - text: В мастере заказа выберите тарифный план
                - strong [ref=f2e193]: Стандартный +
                - text: и бесплатный тариф
                - strong [ref=f2e194]: Free Tier
                - text: .
            - listitem [ref=f2e195]:
              - generic [ref=f2e196]: "6"
              - generic [ref=f2e198]:
                - text: На вкладке
                - strong [ref=f2e199]: Приложения и панели управления
                - text: выберите операционную систему или готовое приложение.
            - listitem [ref=f2e200]:
              - generic [ref=f2e201]: "7"
              - generic [ref=f2e202]: Выберите регион размещения сервера.
            - listitem [ref=f2e204]:
              - generic [ref=f2e205]: "8"
              - generic [ref=f2e206]: При необходимости закажите публичный плавающий IP-адрес, защиту от DDoS-атак и резервное копирование.
            - listitem [ref=f2e208]:
              - generic [ref=f2e209]: "9"
              - generic [ref=f2e210]: Дополнительно добавьте SSH-ключ и укажите название сервера.
            - listitem [ref=f2e212]:
